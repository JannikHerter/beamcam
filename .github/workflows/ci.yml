# The checks from AGENTS.md ("Verifying") on every push to main and every pull request.
# release.yml calls it too, and publishes the Windows installer it builds.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android (unit tests, lint)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew testDebugUnitTest lintDebug assembleDebug
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: android-reports
          path: apps/android/app/build/reports/
      - uses: actions/upload-artifact@v7
        with:
          name: beamcam-android-debug
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk

  linux:
    name: Linux (unit tests)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/linux
    steps:
      - uses: actions/checkout@v7
      # The distro's Python, so PyGObject and GStreamer come from packages like on users' machines.
      # plugins-ugly brings x264enc, which the pipeline tests need to make test video.
      - run: |
          sudo apt-get update -q
          sudo apt-get install -q -y --no-install-recommends python3-gi python3-cryptography \
            gir1.2-gstreamer-1.0 gir1.2-gst-plugins-base-1.0 gir1.2-gdkpixbuf-2.0 \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly gstreamer1.0-libav
      - run: PYTHONPATH=src /usr/bin/python3 -m unittest discover -s tests -t . -v

  windows-core:
    name: Windows core (C# tests, rotation tests)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/windows
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet test tests/Beamcam.Core.Tests
      - run: g++ -std=c++20 -Wall -Wextra -Werror -o convert_tests native/tests/convert_tests.cpp native/src/convert.cpp && ./convert_tests

  windows:
    name: Windows (native build, installer)
    runs-on: windows-2025
    defaults:
      run:
        working-directory: apps/windows
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: cmake -S native -B out\native -A x64
      - run: cmake --build out\native --config Release
      - run: ctest --test-dir out\native -C Release --output-on-failure
      - run: dotnet publish src\Beamcam\Beamcam.csproj -c Release -r win-x64 --self-contained -o out\app
      - run: dotnet publish src\Beamcam.Cli\Beamcam.Cli.csproj -c Release -r win-x64 --self-contained -o out\app
      - run: copy out\native\Release\BeamcamCamera.dll out\app\
      - name: Build the installer
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; if ($LASTEXITCODE) { exit 1 } }
          & $iscc installer\Beamcam.iss
          if ($LASTEXITCODE) { exit 1 }
      - uses: actions/upload-artifact@v7
        with:
          name: beamcam-windows-setup
          path: apps/windows/out/Beamcam-Setup-*.exe
