# Pushing a tag like v0.2.0 builds every download, signs the phone app and publishes a GitHub
# release. Steps for maintainers: docs/operations/development.md#releases.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  # The release key's certificate. A different one must never be published: phones only update an
  # app signed with the same key.
  RELEASE_CERT_SHA256: 0420f68397f561bc68e0037ca2d22e516e5fe29b82ae2d0f5365b2fea078ce83

jobs:
  version:
    name: Versions match the tag
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the last release's tag, to compare versionCode
      - id: v
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          scripts/check-version.sh "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  ci:
    name: CI
    needs: version
    uses: ./.github/workflows/ci.yml

  android:
    name: Android (signed release)
    needs: version
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Build and sign
        env:
          KEYSTORE_BASE64: ${{ secrets.BEAMCAM_KEYSTORE_BASE64 }}
          BEAMCAM_KEYSTORE_PASSWORD: ${{ secrets.BEAMCAM_KEYSTORE_PASSWORD }}
        run: |
          [ -n "$KEYSTORE_BASE64" ] && [ -n "$BEAMCAM_KEYSTORE_PASSWORD" ] || { echo "::error::The release key secrets are missing."; exit 1; }
          export BEAMCAM_KEYSTORE="$RUNNER_TEMP/release.p12"
          echo "$KEYSTORE_BASE64" | base64 -d > "$BEAMCAM_KEYSTORE"
          ./gradlew assembleRelease
          rm -f "$BEAMCAM_KEYSTORE"
      - name: Check the certificate
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          apk=app/build/outputs/apk/release/app-release.apk
          echo "apksigner from $tools"
          report="$("$tools/apksigner" verify --print-certs "$apk")"
          echo "$report"
          digests="$(echo "$report" | grep -o 'certificate SHA-256 digest: [0-9a-f]*' | sed 's/.*: //' | sort -u)"
          [ "$digests" = "$RELEASE_CERT_SHA256" ] || { echo "::error::Signed with ${digests:-nothing}, not the release key."; exit 1; }
          mkdir -p "$RUNNER_TEMP/out" && cp "$apk" "$RUNNER_TEMP/out/Beamcam-$VERSION.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: release-android
          path: ${{ runner.temp }}/out/

  linux:
    name: Linux packages
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Debian and Ubuntu (.deb)
        run: apps/linux/packaging/build-deb.sh debian:13 "$RUNNER_TEMP/out"
      - name: Arch and Manjaro (.pkg.tar.zst)
        run: apps/linux/packaging/build-arch.sh archlinux:latest "$RUNNER_TEMP/out"
      - name: Fedora (.rpm)
        run: apps/linux/packaging/build-rpm.sh fedora:45 "$RUNNER_TEMP/out"
      - uses: actions/upload-artifact@v7
        with:
          name: release-linux
          path: |
            ${{ runner.temp }}/out/*.deb
            ${{ runner.temp }}/out/*.pkg.tar.zst
            ${{ runner.temp }}/out/*.rpm

  publish:
    name: Publish the release
    needs: [version, ci, android, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/artifacts
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          out="$RUNNER_TEMP/release"
          mkdir -p "$out"
          cp "$RUNNER_TEMP"/artifacts/release-android/*.apk "$RUNNER_TEMP"/artifacts/release-linux/* \
             "$RUNNER_TEMP"/artifacts/beamcam-windows-setup/*.exe "$out/"
          (cd "$out" && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt)
          # This version's section of CHANGELOG.md, then which file to download.
          awk -v v="## $VERSION" '$0 == v {on=1; next} /^## / {on=0} on' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          sed "s/{version}/$VERSION/g" .github/release-downloads.md >> "$RUNNER_TEMP/notes.md"
          prerelease=""
          case "$VERSION" in 0.*|*-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" "$out"/* --title "Beamcam $VERSION" --notes-file "$RUNNER_TEMP/notes.md" $prerelease
